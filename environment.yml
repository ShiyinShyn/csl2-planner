name: csl2-planner
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11

  # Native Qt GUI; GIS packages remain jointly managed by Conda.
  - "pyside6>=6.11,<7"

  # GIS; geopandas-base supplies import geopandas without plotting extras.
  - "geopandas-base>=1.1,<2"
  - "shapely>=2.1,<3"
  - "rasterio>=1.4,<2"
  - "pyproj>=3.7,<4"
  - "pyogrio>=0.10,<1"
  - "fiona>=1.10,<2"

  # DEM arrays, OD tables, optimization, sparse graphs and routing.
  - "numpy>=2,<3"
  - "pandas>=2.2,<3"
  - "scipy>=1.15,<2"
  - "networkx>=3.4,<4"

  # Configuration and command-line tools.
  - "pyyaml>=6,<7"
  - "click>=8.1,<9"
  - "rich>=14,<15"

variables:
  # Effective after activation; creation also needs these solver settings.
  CONDA_CHANNELS: conda-forge
  CONDA_CHANNEL_PRIORITY: strict
  PYTHONNOUSERSITE: "1"
